<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELORA | Joyería & Accesorios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Decoración -->
    <div class="sparkle sparkle-1">✦</div>
    <div class="sparkle sparkle-2">✧</div>
    <div class="sparkle sparkle-3">✦</div>

    <!-- Encabezado -->
    <header>

        <img
            src="logo_valora.png.png"
            alt="VELORA Joyería & Accesorios"
            class="logo"
        >

        <p>Elegancia que te representa.</p>

    </header>

    <!-- Contenido -->
    <main>

        <h2>Encuentra tu accesorio</h2>

        <p class="subtitle">
            Elige qué quieres comprar:
        </p>

        <div class="buttons">

            <button id="anillo">
                💍
                <span>Anillo</span>
            </button>

            <button id="manilla">
                ✨
                <span>Manilla</span>
            </button>

        </div>

        <!-- Aquí aparecerán las opciones -->
        <section id="opciones" class="opciones"></section>

    </main>

    <footer>
        <p>VELORA © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
